        <!-- Map container -->
        <div id="map"></div>

        <!-- Display selected coordinates -->
        <div class="field">
          <h3>Selected Coordinates</h3>
          <div class="coordinates-display">
            <span id="lat-display">40.7°N</span>, <span id="lon-display">74.0°W</span>
          </div>
        </div>

        <!-- Use current location button -->
        <button id="use-current-location">📍 Use My Location</button>
      </div>

      <div class="section" id="datetime-section">
        <h2>Date & Time at Location</h2>
        <div class="field">
          <h3>Date</h3>
          <input type="date" id="date">
        </div>
        <div class="field">
          <h3>Time: <span id="time-display" class="value-display">12:00</span></h3>
          <input type="range" id="time" min="0" max="1439" step="1" value="720">
        </div>
        <div class="status" id="sun-status">Calculating sun position...</div>
      </div>

      <div style="text-align: center;">
        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"
          data-name="bmc-button" data-slug="shadowcalculator" data-color="#15803D" data-emoji="" data-font="Cookie"
          data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#ffffff"
          data-coffee-color="#B3826C"></script>
      </div>

      <div class="section" id="object-section">
        <h2>Object</h2>
        <div class="field">
          <h3>Type</h3>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="object-type" value="human" checked>
              <span>Human</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="object-type" value="tree">
              <span>Tree</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="object-type" value="box">
              <span>Post/Box</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="object-type" value="house">
              <span>House</span>
            </label>
          </div>
        </div>
        <div class="field">
          <h3>Height</h3>
          <!-- Metric Input (Hidden by default if starting in Imperial) -->
          <div id="height-metric-container" class="input-with-unit" style="display: none;">
            <input type="number" id="height-metric" min="0.1" max="100" step="0.01">
            <span class="unit">m</span>
          </div>

          <!-- Imperial Input -->
          <div id="height-imperial-container" class="radio-group" style="gap: 10px;">
            <div class="input-with-unit">
              <input type="number" id="height-ft" min="0" max="100" step="1">
              <span class="unit">ft</span>
            </div>
            <div class="input-with-unit">
              <input type="number" id="height-in" min="0" max="11" step="1">
              <span class="unit">in</span>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Settings</h2>
        <div class="field">
          <h3>Units</h3>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="units" value="metric">
              <span>Metric</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="units" value="imperial" checked>
              <span>Imperial</span>
            </label>
          </div>
        </div>
        <div class="field">
          <label class="radio-item">
            <input type="checkbox" id="show-grid" checked>
            <span>Show grid</span>
          </label>
        </div>
        <div class="field">
          <label class="radio-item">
            <input type="checkbox" id="show-math">
            <span>Show math details</span>
          </label>
        </div>
        <div class="field">
          <label class="radio-item">
            <input type="checkbox" id="show-triangle" checked>
            <span>Show triangle diagram</span>
          </label>
        </div>
      </div>

    </div>

    <!-- Main area -->
    <div id="main">
      <div id="scene-container">
        <div id="shadow-info">
          <div>Shadow Length</div>
          <div class="value" id="shadow-length">—</div>
          <div class="context-info" id="shadow-context">—</div>
        </div>
      </div>
      <div id="info-panel">
        <div id="math-details"></div>
        <div id="triangle-container" class="hidden">
          <h3>Right Triangle – Side View</h3>
          <svg id="triangle-svg" viewBox="0 0 450 240" preserveAspectRatio="xMidYMid meet">
            <!-- Triangle fill -->
            <path id="triangle-fill-path" class="triangle-fill" d="M 80 190 L 80 190 L 80 190 Z" />
            <!-- Triangle outline -->
            <path id="triangle-path" class="triangle-path" d="M 80 190 L 80 70 L 350 190 Z" />
            <!-- Angle arc -->
            <path id="angle-arc" class="triangle-angle-arc" d="" />
            <!-- Labels -->
            <text id="height-label" class="triangle-label" x="55" y="120" text-anchor="end">Height</text>
            <text id="height-value" class="triangle-value" x="55" y="140" text-anchor="end">1.75 m</text>
            <text id="shadow-label" class="triangle-label" x="215" y="210" text-anchor="middle">Shadow</text>
            <text id="shadow-value" class="triangle-value" x="215" y="230" text-anchor="middle">2.54 m</text>
            <text id="angle-value" class="triangle-value" x="310" y="178" text-anchor="end">34.6°</text>
          </svg>
        </div>
      </div>
